[project]
name = "ai-model-evaluation-root"
version = "0.0.0"
description = "Root tooling for the AI model evaluation repository"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Supply-chain cooldown: uv only uses distributions uploaded at least 7 days ago.
exclude-newer = "P7D"
