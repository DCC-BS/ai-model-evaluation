[project]
name = "ai-model-evaluation-root"
version = "0.0.0"
description = "Root tooling for the AI model evaluation repository"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Supply-chain cooldown: only resolve releases older than 7 days.
exclude-newer = "P7D"
# TEMPORARY until 2026-10-29: security releases of certifi younger than 7 days. The weekly
# dependency routine removes these entries once the locked versions are 7 days old.
exclude-newer-package = { certifi = "P0D" }
