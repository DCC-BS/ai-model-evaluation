[project]
name = "ocr-evaluation"
version = "0.1.0"
description = "OCR model evaluation suite for VLMs served via vLLM"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jiwer",
    "datasets",
    "openai",
    "httpx",
    "tqdm",
    "Pillow",
    "matplotlib",
    "pandas",
    "seaborn",
]

[tool.uv]
exclude-newer = "1 week"
