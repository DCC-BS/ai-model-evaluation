[project]
name = "qwen-tts"
version = "0.1.0"
description = "Qwen3-TTS demo harness for structured listening tests"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gradio>=5.50.0",
    "httpx>=0.28.1",
    "numpy>=2.2.6",
    "vllm==0.32.0",
    "vllm-omni>=0.14.0",
]

[tool.uv]
# Supply-chain cooldown: uv only uses distributions uploaded at least 7 days ago.
exclude-newer = "P7D"
# TEMPORARY until 2026-10-29: certifi skip the cooldown entirely (P0D), so the locked
# security fixes don't get downgraded. The weekly dependency routine removes only these temporary
# entries once the locked versions are 7 days old; Renovate's 14-day minimum age still applies.
# TEMPORARY until 2026-10-29: brotli 1.2.1 fix CVE-2026-111497 (Brotli decoder) and skip the cooldown (P0D).
# The weekly dependency routine removes these entries once the locked versions are 7 days old.
exclude-newer-package = { certifi = "P0D", brotli = "P0D" }
